# Same as codex-repl, plus the task site's kernel/xwebmcp tools registered in
# the browser before the agent starts. The agent gets the same tools and
# instruction; only the WebMCP tools the page lists differ.
agent = "codex"
model = "gpt-5.6-luna"
agent_version = "0.120.0"
toolset = "xwebmcp"

[toolset_args]
toolsets = ["repl"]
xwebmcp_ref = "main"

[browser]
config = { stealth = true }
