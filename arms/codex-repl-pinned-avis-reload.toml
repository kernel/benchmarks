# codex-repl-pinned plus the guidance given to customers for Avis's
# "Page Not Available" error after the vehicle search: reload the page once.
agent = "codex"
model = "gpt-6-luna"
agent_version = "0.163.0"
toolset = "kernel-mcp-local"

[agent_kwargs]
disable_web_search = true

[toolset_args]
toolsets = ["repl", "computer"]

[browser]
config = { stealth = true }
configurator = "pinned"

[browser.configurator_args.extra_steering]
"avis.com" = """
If avis.com shows "Page Not Available" or "Oops! Something went wrong on our end" after you search for cars or pick a car, reload the same page once (a full page load of the current URL, for example location.reload()). Do not go back to the home page and search again. If the error is still there after one reload, report the task as website_error.
"""
