# Same as codex-repl, but each site's browser, proxy and persona come from the
# fixed table in configurators/pinned/sites.toml, with a new proxy per trial.
agent = "codex"
model = "gpt-6-luna"
agent_version = "0.163.0"
toolset = "kernel-mcp-local"

[agent_kwargs]
disable_web_search = true

[toolset_args]
toolsets = ["repl"]

[browser]
config = { stealth = true }
configurator = "pinned"
