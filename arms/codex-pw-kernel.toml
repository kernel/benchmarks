# Codex driving a Kernel stealth browser through Playwright MCP over CDP, the
# same agent, tools and container as the other providers' codex-pw-* arms.
agent = "codex"
model = "gpt-6-luna"
agent_version = "0.163.0"
toolset = "playwright-mcp"
environment = "remote-browser"

[agent_kwargs]
disable_web_search = true

[browser.config]
provider = "kernel"
params = { stealth = true, timeout_seconds = 1800 }
