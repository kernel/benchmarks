# Claude Code driving a browserbase browser through Playwright MCP over CDP, the
# same agent, tools and task container as every claude-pw-* arm. The container
# runs on a Kernel VM used only as compute; the browser is a separate session.
# Browser: Browserbase's managed proxies and CAPTCHA solving. Advanced stealth is left
# out: Browserbase rejects it outside the Enterprise plan ("Verified mode").
agent = "claude-code"
model = "claude-sonnet-5-5"
agent_version = "2.1.238"
toolset = "playwright-mcp"
environment = "kernel-vm-remote-browser"

[agent_kwargs]
disable_web_search = true

[browser.config]
provider = "browserbase"
params = { keepAlive = true, timeout = 1800, region = "us-east-1", proxies = true, browserSettings = { solveCaptchas = true } }
