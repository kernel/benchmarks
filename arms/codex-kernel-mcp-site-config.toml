# Same as codex-kernel-mcp, but each task's browser and proxy come from
# Kernel's config registry for the task's site, and the registry's guidance
# for that site is added to the instruction.
agent = "codex"
model = "gpt-5.6-luna"
agent_version = "0.120.0"
toolset = "kernel-mcp-local"

[browser]
config = { stealth = true }
configurator = "site-config"

[browser.configurator_args]
model = "anthropic/claude-haiku-5-5"
steering = true
