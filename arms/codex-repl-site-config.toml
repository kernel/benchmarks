# Same as codex-repl, but each task's browser and proxy come from Kernel's
# config registry for the task's site, and the registry's guidance for that
# site is added to the instruction.
agent = "codex"
model = "gpt-6-luna"
agent_version = "0.163.0"
toolset = "kernel-mcp-local"

[agent_kwargs]
disable_web_search = true

[toolset_args]
toolsets = ["repl"]

[browser]
config = { stealth = true }
configurator = "site-config"

[browser.configurator_args]
model = "anthropic/claude-haiku-5-5"
steering = true
