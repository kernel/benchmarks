name: Retail cart flows with the browser REPL

on:
  workflow_dispatch:
    inputs:
      arms:
        description: Comma-separated arm names (empty runs every arm in benchmarks/retail-cart.toml)
        required: false
        default: ""
        type: string
      tasks:
        description: Comma-separated task IDs, or all
        required: false
        default: all
        type: string
      attempts:
        description: Trials per task and arm
        required: false
        default: "3"
        type: string
      concurrency:
        description: Concurrent trials per arm
        required: false
        default: "16"
        type: string
      kernel_mcp_server_ref:
        description: kernel/kernel-mcp-server git ref to build (empty builds main)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    uses: ./.github/workflows/_run.yml
    secrets: inherit
    with:
      benchmark: retail-cart
      arms: ${{ inputs.arms }}
      tasks: ${{ inputs.tasks }}
      attempts: ${{ inputs.attempts }}
      concurrency: ${{ inputs.concurrency }}
      toolset_ref: ${{ inputs.kernel_mcp_server_ref }}
