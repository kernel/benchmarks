name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          version: "0.8.17"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: node --test suites/public-web/*.test.mjs
      - name: Prepare every static arm for one task
        run: uv run bench prepare kernel-mcp-clawbench --arms codex-kernel-mcp,claude-kernel-mcp --tasks v2-1134-chapter-finder-redcross --out "$RUNNER_TEMP/prepared"

      - name: Prepare all public-web arms
        run: uv run bench prepare public-web --out "$RUNNER_TEMP/public-web"
      - name: Prepare alternate runners
        run: |
          for runner in claude pi; do
            uv run bench prepare public-web --runner "$runner" --tasks github-merged-pr --out "$RUNNER_TEMP/public-web-$runner"
          done

  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.1.2
        with:
          bun-version: "1.3.3"
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check .
      - run: bunx tsc --noEmit
      - run: bun test
