# Standard: protected sites, added for vendor coverage. Wayfair is hard: its
# press-and-hold check stopped Kernel with the macOS fingerprint on first try.

[[tasks]]
id = "wayfair-hangers"
site = "wayfair.com"
start_url = "https://www.wayfair.com/"
item = "a pack of clothes hangers that can be shipped"
cart_url = "https://www.wayfair.com/v/checkout/basket/show"
