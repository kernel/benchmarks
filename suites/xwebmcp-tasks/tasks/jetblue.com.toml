site = "jetblue.com"
start_url = "https://www.jetblue.com/"

[[tasks]]
id = "jetblue-cheapest-one-way"
split = "train"
instruction = "Find the cheapest one-way fare on JetBlue for 1 adult from Boston (BOS) to Fort Lauderdale (FLL) on {{date}}, in any fare type. Report its flight number(s), departure time, fare type and price."
fixture = { date = { days_from_start = 21 } }

[[tasks]]
id = "jetblue-earliest-jfk-mco"
split = "train"
instruction = "What is the earliest nonstop JetBlue flight from New York (JFK) to Orlando (MCO) on {{date}}? Report its flight number, departure time and the cheapest fare on it for 1 adult."
fixture = { date = { days_from_start = 18 } }

[[tasks]]
id = "jetblue-jfk-sju-nonstops"
split = "validation"
instruction = "List every nonstop JetBlue flight from New York (JFK) to San Juan (SJU) on {{date}}, with each one's flight number, departure time and lowest fare for 1 adult."
fixture = { date = { days_from_start = 24 } }

[[tasks]]
id = "jetblue-afternoon-fll-jfk"
split = "test"
instruction = "Find the cheapest one-way JetBlue flight from Fort Lauderdale (FLL) to New York (JFK) on {{date}} that departs after 3:00 PM. Report its flight number(s), departure time, fare type and price for 1 adult."
fixture = { date = { days_from_start = 20 } }
