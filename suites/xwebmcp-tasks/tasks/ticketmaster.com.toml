site = "ticketmaster.com"
start_url = "https://www.ticketmaster.com/"

# More results: a whole date range.
[[tasks]]
id = "ticketmaster-chicago-concerts"
split = "train"
instruction = "Find up to 10 concerts in Chicago, IL between {{start}} and {{end}}, soonest first. Report each one's name, date and venue, and how many of them are at the United Center."
fixture = { start = { days_from_start = 7 }, end = { days_from_start = 21 } }

# Deeper flow: event found, then its ticket offers.
[[tasks]]
id = "ticketmaster-warriors-home-game"
split = "train"
instruction = "Find the next two Golden State Warriors home games at Chase Center listed on Ticketmaster. For each, report the opponent, the date and time, and the lowest All-In price per ticket for 2 tickets. Do not select or hold any tickets."

# More constraints: genre, city, dates, evening only.
[[tasks]]
id = "ticketmaster-la-comedy-weekend"
split = "validation"
instruction = "Find three comedy shows in Los Angeles, CA on {{saturday}} or {{sunday}} that start at 7:00 PM or later. Report each one's name, date, start time and venue."
fixture = { saturday = { days_from_start = 15 }, sunday = { days_from_start = 16 } }

# More constraints: team, venue, dates, then prices for two of them. Home
# games usually have resale tickets where MSG's concerts are often sold out.
# The NHL regular season runs October to April; pick another team off-season.
[[tasks]]
id = "ticketmaster-rangers-cheapest"
split = "test"
instruction = "Find the next two New York Rangers home games at Madison Square Garden on Ticketmaster on or after {{start}}, skipping any that are sold out. For each, report the opponent, the date and time, and the lowest All-In price per ticket for 2 tickets together that anyone can buy (not cardmember-only or presale offers), and say which game is cheaper. Do not select or hold any tickets."
fixture = { start = { days_from_start = 3 } }
