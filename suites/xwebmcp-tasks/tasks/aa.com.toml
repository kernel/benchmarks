site = "aa.com"
start_url = "https://www.aa.com/"

# Deeper flow: round trip, both fares chosen, through to the trip summary.
[[tasks]]
id = "aa-round-trip-summary"
split = "train"
instruction = "Price an American Airlines round trip for 1 adult from Dallas/Fort Worth (DFW) to Los Angeles (LAX), leaving {{depart}} and returning {{return}}. Choose the cheapest Main Cabin fare (not Basic Economy) on each leg and stop on American's trip summary. Report both flights and the total shown there."
fixture = { depart = { days_from_start = 21 }, return = { days_from_start = 25 } }
actions = ["select_fare", "select_fare_option"]

# More results: every nonstop of the day.
[[tasks]]
id = "aa-clt-lga-nonstops"
split = "train"
instruction = "List every nonstop American Airlines flight from Charlotte (CLT) to New York LaGuardia (LGA) on {{date}}, with each one's flight number, departure time and lowest Main Cabin price for 1 adult, and say how many there are."
fixture = { date = { days_from_start = 24 } }

# Deeper flow: fare chosen, through to the trip summary.
[[tasks]]
id = "aa-trip-summary"
split = "validation"
instruction = "Choose the cheapest Main Cabin fare (not Basic Economy) for 1 adult on a one-way American Airlines flight from Miami (MIA) to Chicago O'Hare (ORD) on {{date}}, and stop on American's trip summary. Report the flight number(s), the fare, the taxes and fees, and the total shown there."
fixture = { date = { days_from_start = 22 } }
actions = ["select_fare", "select_fare_option"]

# More constraints: time window, nonstop and fare type.
[[tasks]]
id = "aa-morning-nonstop-main"
split = "test"
instruction = "Find the cheapest nonstop American Airlines flight from Phoenix (PHX) to Dallas/Fort Worth (DFW) on {{date}} that departs before noon, in Main Cabin (not Basic Economy). Report its flight number, departure time and price for 1 adult."
fixture = { date = { days_from_start = 19 } }
