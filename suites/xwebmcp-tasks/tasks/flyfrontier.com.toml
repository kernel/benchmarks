site = "flyfrontier.com"
start_url = "https://www.flyfrontier.com/"

[[tasks]]
id = "frontier-cheapest-one-way"
split = "train"
instruction = "Find the cheapest one-way fare on Frontier for 1 adult from Denver (DEN) to Las Vegas (LAS) on {{date}}. Report its flight number(s), departure time and price."
fixture = { date = { days_from_start = 21 } }

[[tasks]]
id = "frontier-round-trip"
split = "train"
instruction = "Find the cheapest Frontier round trip for 1 adult from Denver (DEN) to Phoenix (PHX), leaving {{depart}} and returning {{return}}. Report the outbound and return flight numbers, departure times and the price of each leg."
fixture = { depart = { days_from_start = 24 }, return = { days_from_start = 27 } }

[[tasks]]
id = "frontier-den-mco-nonstops"
split = "validation"
instruction = "List the nonstop Frontier flights from Denver (DEN) to Orlando (MCO) on {{date}}, with each one's flight number, departure time and price for 1 adult."
fixture = { date = { days_from_start = 22 } }

[[tasks]]
id = "frontier-las-den"
split = "test"
instruction = "What is the cheapest one-way Frontier flight from Las Vegas (LAS) to Denver (DEN) on {{date}} for 1 adult? Report its flight number(s), departure time and price."
fixture = { date = { days_from_start = 19 } }
