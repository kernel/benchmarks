site = "resy.com"
start_url = "https://resy.com/"

# More constraints: cuisine, neighborhood, party size, time window.
[[tasks]]
id = "resy-west-village-italian"
split = "train"
instruction = "Find three Italian restaurants in New York's West Village on Resy with a table for 2 open on {{date}} between 7:00 PM and 8:30 PM. Report each one's name and one open time in that window. Do not book anything."
fixture = { date = { days_from_start = 9 } }

# More results: a collection's whole list.
[[tasks]]
id = "resy-la-collection"
split = "train"
instruction = "Open one of the curated collections Resy shows for Los Angeles and list every restaurant in it, with each one's neighborhood and cuisine. Report the collection's name too."

# More constraints: same restaurant, two dates.
[[tasks]]
id = "resy-two-dates"
split = "validation"
instruction = "Find a Japanese restaurant in San Francisco on Resy, then compare its availability for 4 people on {{day1}} and {{day2}}: report the open times between 6:00 PM and 9:00 PM on each date, and which date has more of them. Do not book anything."
fixture = { day1 = { days_from_start = 10 }, day2 = { days_from_start = 11 } }

# Deeper flow: a slot found, then its terms, without booking.
[[tasks]]
id = "resy-sf-quote"
split = "test"
instruction = "Find a Japanese restaurant in San Francisco on Resy with a table for 4 open on {{date}} between 6:00 PM and 8:00 PM, and look up the terms of one open slot in that window without booking it. Report the restaurant, the time, whether a card is required, any deposit or fee, and the cancellation policy."
fixture = { date = { days_from_start = 10 } }
